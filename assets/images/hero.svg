<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffbe0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3a86ff" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <circle cx="40" cy="40" r="2" fill="rgba(255,190,11,0.2)"/>
    </pattern>
  </defs>
  
  <!-- Sfondo -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#circuitGrid)"/>

  <!-- Tracce di circuito stampato tecnologiche -->
  <g stroke="rgba(58, 134, 255, 0.25)" stroke-width="2" fill="none">
    <path d="M 50 150 L 220 150 L 280 210 L 450 210"/>
    <path d="M 120 480 L 280 480 L 350 410 L 680 410"/>
    <path d="M 400 80 L 400 180 L 460 240 L 700 240"/>
    <circle cx="450" cy="210" r="4" fill="#3a86ff"/>
    <circle cx="680" cy="410" r="4" fill="#ffbe0b"/>
    <circle cx="280" cy="210" r="3" fill="#ffbe0b"/>
  </g>

  <!-- Pannello Quadro Elettrico / Modulo Tecnico Centrale -->
  <rect x="220" y="110" width="360" height="380" rx="16" fill="#111827" stroke="rgba(255, 190, 11, 0.4)" stroke-width="2"/>
  <rect x="240" y="130" width="320" height="40" rx="8" fill="#1e293b"/>
  
  <!-- LED indicatori di stato -->
  <circle cx="265" cy="150" r="5" fill="#10b981"/>
  <circle cx="285" cy="150" r="5" fill="#ffbe0b"/>
  <circle cx="305" cy="150" r="5" fill="#3a86ff"/>
  <text x="330" y="155" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">QUADRO GENERALE • DI.CO CEI 64-8</text>

  <!-- Interruttori Magnetotermici e Moduli Din -->
  <g fill="#1f293d" stroke="rgba(255,255,255,0.1)" stroke-width="1">
    <!-- Fila 1 -->
    <rect x="250" y="195" width="45" height="75" rx="4"/>
    <rect x="305" y="195" width="45" height="75" rx="4"/>
    <rect x="360" y="195" width="45" height="75" rx="4"/>
    <rect x="415" y="195" width="45" height="75" rx="4"/>
    <rect x="470" y="195" width="75" height="75" rx="4" fill="#1e293b" stroke="#ffbe0b"/>
    
    <!-- Fila 2 -->
    <rect x="250" y="295" width="75" height="75" rx="4"/>
    <rect x="335" y="295" width="45" height="75" rx="4"/>
    <rect x="390" y="295" width="45" height="75" rx="4"/>
    <rect x="445" y="295" width="100" height="75" rx="4" fill="#1e293b"/>
  </g>

  <!-- Leve degli interruttori -->
  <rect x="265" y="210" width="15" height="22" rx="3" fill="#ffbe0b"/>
  <rect x="320" y="210" width="15" height="22" rx="3" fill="#ffbe0b"/>
  <rect x="375" y="210" width="15" height="22" rx="3" fill="#ffbe0b"/>
  <rect x="430" y="210" width="15" height="22" rx="3" fill="#ffbe0b"/>
  <rect x="495" y="210" width="25" height="25" rx="3" fill="#10b981"/>

  <!-- Display Digitale / Misuratore di Potenza -->
  <rect x="250" y="395" width="295" height="65" rx="8" fill="#090d16" stroke="rgba(58, 134, 255, 0.4)" stroke-width="1.5"/>
  <text x="270" y="425" fill="#38bdf8" font-family="Courier, monospace" font-size="14" font-weight="700">TENSIONE: 230.4 V ~ 50.0 Hz</text>
  <text x="270" y="445" fill="#10b981" font-family="Courier, monospace" font-size="13" font-weight="600">SISTEMA CONFORME • NESSUNA ANOMALIA</text>

  <!-- Badge Sicurezza e Norma CEI -->
  <g transform="translate(510, 430)">
    <circle cx="30" cy="30" r="30" fill="url(#glowGrad)"/>
    <circle cx="30" cy="30" r="26" fill="#111827"/>
    <path d="M30 14 L20 32 L28 32 L26 46 L38 28 L30 28 Z" fill="#ffbe0b"/>
  </g>
</svg>
