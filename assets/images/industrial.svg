<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIndGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141c2c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgIndGrad)"/>
  <rect x="40" y="40" width="520" height="320" rx="16" fill="#111827" stroke="rgba(255,190,11,0.3)" stroke-width="2"/>
  
  <!-- Canalizzazioni metalliche industriali e quadro di potenza -->
  <rect x="80" y="80" width="440" height="24" rx="4" fill="#334155" stroke="#475569"/>
  <!-- Cavi di potenza -->
  <line x1="90" y1="104" x2="90" y2="280" stroke="#ef4444" stroke-width="5"/>
  <line x1="105" y1="104" x2="105" y2="280" stroke="#3b82f6" stroke-width="5"/>
  <line x1="120" y1="104" x2="120" y2="280" stroke="#eab308" stroke-width="5"/>
  <line x1="135" y1="104" x2="135" y2="280" stroke="#10b981" stroke-width="5"/>

  <!-- Grande armadio industriale BT con blocco sezionatore -->
  <rect x="220" y="120" width="220" height="170" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <rect x="240" y="140" width="40" height="60" rx="4" fill="#0f172a" stroke="#ef4444"/>
  <circle cx="260" cy="170" r="12" fill="#ef4444"/>
  <rect x="300" y="140" width="120" height="24" fill="#090d16"/>
  <text x="310" y="157" fill="#ffbe0b" font-family="Courier, monospace" font-size="12" font-weight="700">400V 50Hz 250A</text>

  <!-- Motore trifase / Macchinario -->
  <circle cx="480" cy="220" r="30" fill="#334155" stroke="#ffbe0b" stroke-width="2"/>
  <circle cx="480" cy="220" r="10" fill="#111827"/>

  <text x="60" y="325" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">INDUSTRIA & STABILIMENTI</text>
  <text x="60" y="345" fill="#94a3b8" font-family="sans-serif" font-size="12">Quadri BT di potenza, canalizzazioni blindosbarra, automazione e manutenzione</text>
</svg>
