<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCommGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgCommGrad)"/>
  <rect x="40" y="40" width="520" height="320" rx="16" fill="#111a2f" stroke="rgba(58,134,255,0.25)" stroke-width="2"/>
  
  <!-- Ufficio moderno / Negozio con illuminazione tecnica a binario -->
  <line x1="100" y1="120" x2="500" y2="120" stroke="#475569" stroke-width="4"/>
  <!-- Faretti a binario -->
  <rect x="160" y="124" width="24" height="20" rx="2" fill="#ffbe0b"/>
  <path d="M 160 144 L 140 220 L 204 220 Z" fill="rgba(255,190,11,0.12)"/>
  
  <rect x="288" y="124" width="24" height="20" rx="2" fill="#ffbe0b"/>
  <path d="M 288 144 L 268 220 L 332 220 Z" fill="rgba(255,190,11,0.12)"/>

  <rect x="416" y="124" width="24" height="20" rx="2" fill="#ffbe0b"/>
  <path d="M 416 144 L 396 220 L 460 220 Z" fill="rgba(255,190,11,0.12)"/>

  <!-- Telecamera di sicurezza e quadro dati -->
  <circle cx="100" cy="120" r="12" fill="#3a86ff"/>
  <rect x="200" y="220" width="200" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="230" y="255" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">RETE DATI & ILLUMINAZIONE LED</text>

  <text x="60" y="325" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">ATTIVITÀ COMMERCIALI & UFFICI</text>
  <text x="60" y="345" fill="#94a3b8" font-family="sans-serif" font-size="12">Sistemi di sicurezza, controllo varchi, cablaggio strutturato e illuminotecnica</text>
</svg>
