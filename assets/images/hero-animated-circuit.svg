<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Gradiente Quadro e Metallo Industriale -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#162238"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>

    <!-- Bagliore Elettrico Impulsi -->
    <linearGradient id="currentPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffbe0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffbe0b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filtro Glow al Neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Animazioni CSS native a 60fps per simulare flusso di corrente e attività dei quadri */
    .wire-pulse {
      stroke-dasharray: 25 120;
      animation: electricalFlow 3.2s linear infinite;
    }
    .wire-pulse-fast {
      stroke-dasharray: 30 100;
      animation: electricalFlow 2s linear infinite reverse;
    }
    .led-blink-green {
      animation: ledPulse 1.6s ease-in-out infinite;
    }
    .led-blink-amber {
      animation: ledPulse 2.4s ease-in-out infinite alternate;
    }
    .led-blink-blue {
      animation: ledPulse 1.2s ease-in-out infinite;
    }
    .switch-wave {
      animation: meterWave 4s ease-in-out infinite alternate;
    }

    @keyframes electricalFlow {
      from { stroke-dashoffset: 290; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes ledPulse {
      0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 2px transparent); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px currentColor); }
    }
    @keyframes meterWave {
      0% { transform: scaleX(0.7); }
      50% { transform: scaleX(0.92); }
      100% { transform: scaleX(0.78); }
    }
  </style>

  <!-- Sfondo Sala Quadri -->
  <rect width="800" height="450" fill="url(#panelGrad)"/>

  <!-- Passerelle Metalliche Blindosbarra Aeree -->
  <rect x="0" y="25" width="800" height="24" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <line x1="0" y1="37" x2="800" y2="37" stroke="#475569" stroke-width="1" stroke-dasharray="10, 10"/>

  <!-- Linee Elettriche e Cavi di Potenza Trifase -->
  <g fill="none" stroke-width="3.5">
    <!-- Cavo Fase L1 Rosso -->
    <path d="M 60 49 L 60 140 L 160 140 L 160 210" stroke="#ef4444"/>
    <path d="M 60 49 L 60 140 L 160 140 L 160 210" stroke="#fff" stroke-width="2" class="wire-pulse"/>

    <!-- Cavo Fase L2 Giallo -->
    <path d="M 90 49 L 90 120 L 260 120 L 260 210" stroke="#ffbe0b"/>
    <path d="M 90 49 L 90 120 L 260 120 L 260 210" stroke="#fff" stroke-width="2" class="wire-pulse-fast"/>

    <!-- Cavo Fase L3 Blu -->
    <path d="M 120 49 L 120 100 L 360 100 L 360 210" stroke="#3b82f6"/>
    <path d="M 120 49 L 120 100 L 360 100 L 360 210" stroke="#fff" stroke-width="2" class="wire-pulse"/>

    <!-- Cavo Neutro / Terra -->
    <path d="M 150 49 L 150 80 L 520 80 L 520 210" stroke="#10b981"/>
    <path d="M 150 49 L 150 80 L 520 80 L 520 210" stroke="#fff" stroke-width="2" class="wire-pulse-fast"/>
  </g>

  <!-- Armadio Quadro Elettrico Principale -->
  <rect x="130" y="190" width="540" height="230" rx="10" fill="#111c30" stroke="#334155" stroke-width="2"/>
  <rect x="145" y="205" width="510" height="34" rx="6" fill="#0b1322"/>
  
  <!-- LED di stato attivi su quadro -->
  <circle cx="170" cy="222" r="5" fill="#10b981" class="led-blink-green" style="color: #10b981;"/>
  <circle cx="190" cy="222" r="5" fill="#ffbe0b" class="led-blink-amber" style="color: #ffbe0b;"/>
  <circle cx="210" cy="222" r="5" fill="#00d2ff" class="led-blink-blue" style="color: #00d2ff;"/>
  <text x="235" y="227" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" letter-spacing="1">SISTEMA ELETTRO IMPIANTI • LIVE TELEMETRIA 400V</text>

  <!-- File Magnetotermici DIN -->
  <g fill="#1a253c" stroke="#334155" stroke-width="1">
    <rect x="160" y="260" width="38" height="60" rx="4"/>
    <rect x="205" y="260" width="38" height="60" rx="4"/>
    <rect x="250" y="260" width="38" height="60" rx="4"/>
    <rect x="295" y="260" width="38" height="60" rx="4"/>
    <rect x="340" y="260" width="60" height="60" rx="4" fill="#162238" stroke="#ffbe0b"/>

    <rect x="420" y="260" width="75" height="60" rx="4" fill="#090f1a"/>
    <rect x="505" y="260" width="135" height="60" rx="4" fill="#090f1a"/>
  </g>

  <!-- Leve salvavita posizionate su ON -->
  <rect x="172" y="272" width="14" height="18" rx="2" fill="#ffbe0b"/>
  <rect x="217" y="272" width="14" height="18" rx="2" fill="#ffbe0b"/>
  <rect x="262" y="272" width="14" height="18" rx="2" fill="#ffbe0b"/>
  <rect x="307" y="272" width="14" height="18" rx="2" fill="#ffbe0b"/>
  <rect x="360" y="270" width="20" height="22" rx="3" fill="#10b981"/>

  <!-- Display Multimetro Digitale Attivo con Onda -->
  <text x="435" y="285" fill="#38bdf8" font-family="Courier, monospace" font-size="12" font-weight="700">230.1 V</text>
  <text x="435" y="305" fill="#10b981" font-family="Courier, monospace" font-size="11" font-weight="600">50.00 Hz</text>

  <!-- Barra Assorbimento Carico Dinamica -->
  <text x="515" y="282" fill="#94a3b8" font-family="sans-serif" font-size="10">CARICO LINEA:</text>
  <rect x="515" y="292" width="115" height="12" rx="3" fill="#1e293b"/>
  <rect x="515" y="292" width="95" height="12" rx="3" fill="url(#currentPulse)" class="switch-wave"/>

  <!-- Tracciato inferiore con connessioni alla messa a terra -->
  <path d="M 200 350 L 200 395 L 600 395 L 600 350" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="8,6"/>
  <text x="340" y="388" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">EQUIPOTENZIALE TERRA CONFORME CEI 64-8</text>
</svg>
